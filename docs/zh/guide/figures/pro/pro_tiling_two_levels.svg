<svg xmlns="http://www.w3.org/2000/svg" width="1823" height="930" viewBox="0 0 1823 930">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F9FC"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#CFE0FA"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7F8F3"/>
      <stop offset="1" stop-color="#C5EBDD"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1D9"/>
      <stop offset="1" stop-color="#FFD294"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2ECFC"/>
      <stop offset="1" stop-color="#DDCFF4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#243B63" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52647D"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans", sans-serif; fill: #102A56; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 25px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #40516C; }
      .task { font-size: 21px; font-weight: 700; }
      .core { font-size: 22px; font-weight: 700; }
      .stage { font-size: 17px; fill: #425675; }
      .line { stroke: #52647D; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect width="1823" height="930" fill="url(#panel)"/>

  <!-- Level 1 -->
  <text class="title" x="911.5" y="49" text-anchor="middle">Level 1  Inter-core partitioning: split one complete tensor into task blocks</text>

  <text class="subtitle" x="400" y="95" text-anchor="middle">Complete input tensor in Global Memory</text>
  <g filter="url(#shadow)">
    <!-- One tensor: 4 columns x 3 rows -->
    <rect x="70" y="115" width="660" height="252" rx="8" fill="#FFFFFF" stroke="#263F67" stroke-width="4"/>

    <rect x="72" y="117" width="163" height="82" fill="url(#blue)"/>
    <rect x="237" y="117" width="163" height="82" fill="url(#green)"/>
    <rect x="402" y="117" width="163" height="82" fill="url(#orange)"/>
    <rect x="567" y="117" width="161" height="82" fill="url(#purple)"/>

    <rect x="72" y="201" width="163" height="82" fill="url(#blue)"/>
    <rect x="237" y="201" width="163" height="82" fill="url(#green)"/>
    <rect x="402" y="201" width="163" height="82" fill="url(#orange)"/>
    <rect x="567" y="201" width="161" height="82" fill="url(#purple)"/>

    <rect x="72" y="285" width="163" height="80" fill="url(#blue)"/>
    <rect x="237" y="285" width="163" height="80" fill="url(#green)"/>
    <rect x="402" y="285" width="163" height="80" fill="url(#orange)"/>
    <rect x="567" y="285" width="161" height="80" fill="url(#purple)"/>

    <path d="M235 115 V367 M400 115 V367 M565 115 V367 M70 199 H730 M70 283 H730" stroke="#70819A" stroke-width="2"/>
  </g>

  <g class="task" text-anchor="middle">
    <text x="152.5" y="166">T0</text><text x="317.5" y="166">T1</text><text x="482.5" y="166">T2</text><text x="647.5" y="166">T3</text>
    <text x="152.5" y="250">T4</text><text x="317.5" y="250">T5</text><text x="482.5" y="250">T6</text><text x="647.5" y="250">T7</text>
    <text x="152.5" y="334">T8</text><text x="317.5" y="334">T9</text><text x="482.5" y="334">T10</text><text x="647.5" y="334">T11</text>
  </g>
  <text class="small" x="400" y="397" text-anchor="middle">The outer border is one tensor; grid lines cut it into 12 basic task blocks.</text>

  <path class="line" d="M758 241 H810" marker-end="url(#arrow)"/>
  <text class="subtitle" x="1250" y="95" text-anchor="middle">Task blocks assigned across AI Cores</text>

  <!-- Core assignments -->
  <g filter="url(#shadow)">
    <rect x="835" y="116" width="190" height="50" rx="8" fill="url(#blue)" stroke="#6D86AC" stroke-width="2"/>
    <rect x="1050" y="116" width="130" height="50" rx="8" fill="url(#blue)" stroke="#6D86AC" stroke-width="2"/>
    <rect x="1195" y="116" width="130" height="50" rx="8" fill="url(#blue)" stroke="#6D86AC" stroke-width="2"/>
    <rect x="1340" y="116" width="130" height="50" rx="8" fill="url(#blue)" stroke="#6D86AC" stroke-width="2"/>

    <rect x="835" y="181" width="190" height="50" rx="8" fill="url(#green)" stroke="#62A18D" stroke-width="2"/>
    <rect x="1050" y="181" width="130" height="50" rx="8" fill="url(#green)" stroke="#62A18D" stroke-width="2"/>
    <rect x="1195" y="181" width="130" height="50" rx="8" fill="url(#green)" stroke="#62A18D" stroke-width="2"/>
    <rect x="1340" y="181" width="130" height="50" rx="8" fill="url(#green)" stroke="#62A18D" stroke-width="2"/>

    <rect x="835" y="246" width="190" height="50" rx="8" fill="url(#orange)" stroke="#C78B3E" stroke-width="2"/>
    <rect x="1050" y="246" width="130" height="50" rx="8" fill="url(#orange)" stroke="#C78B3E" stroke-width="2"/>
    <rect x="1195" y="246" width="130" height="50" rx="8" fill="url(#orange)" stroke="#C78B3E" stroke-width="2"/>
    <rect x="1340" y="246" width="130" height="50" rx="8" fill="url(#orange)" stroke="#C78B3E" stroke-width="2"/>

    <rect x="835" y="311" width="190" height="50" rx="8" fill="url(#purple)" stroke="#8F79B4" stroke-width="2"/>
    <rect x="1050" y="311" width="130" height="50" rx="8" fill="url(#purple)" stroke="#8F79B4" stroke-width="2"/>
    <rect x="1195" y="311" width="130" height="50" rx="8" fill="url(#purple)" stroke="#8F79B4" stroke-width="2"/>
    <rect x="1340" y="311" width="130" height="50" rx="8" fill="url(#purple)" stroke="#8F79B4" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text class="core" x="930" y="149">AI Core 0</text><text class="task" x="1115" y="149">T0</text><text class="task" x="1260" y="149">T4</text><text class="task" x="1405" y="149">T8</text>
    <text class="core" x="930" y="214">AI Core 1</text><text class="task" x="1115" y="214">T1</text><text class="task" x="1260" y="214">T5</text><text class="task" x="1405" y="214">T9</text>
    <text class="core" x="930" y="279">AI Core 2</text><text class="task" x="1115" y="279">T2</text><text class="task" x="1260" y="279">T6</text><text class="task" x="1405" y="279">T10</text>
    <text class="core" x="930" y="344">AI Core 3</text><text class="task" x="1115" y="344">T3</text><text class="task" x="1260" y="344">T7</text><text class="task" x="1405" y="344">T11</text>
  </g>
  <text class="body" x="1580" y="213" text-anchor="middle">
    <tspan x="1580" dy="0">Each core receives</tspan>
    <tspan x="1580" dy="30">complete task blocks</tspan>
  </text>

  <path d="M25 440 H1798" stroke="#AAB6C8" stroke-width="2" stroke-dasharray="12 10"/>

  <!-- Level 2 -->
  <text class="title" x="911.5" y="493" text-anchor="middle">Level 2  Intra-core buffering: overlap tasks with a two-buffer pipeline</text>

  <g filter="url(#shadow)">
    <rect x="70" y="574" width="220" height="72" rx="10" fill="url(#blue)" stroke="#6D86AC" stroke-width="2"/>
    <rect x="325" y="584" width="82" height="52" rx="8" fill="url(#blue)" stroke="#6D86AC" stroke-width="2"/>
    <rect x="419" y="584" width="82" height="52" rx="8" fill="url(#green)" stroke="#62A18D" stroke-width="2"/>
    <rect x="513" y="584" width="82" height="52" rx="8" fill="url(#blue)" stroke="#6D86AC" stroke-width="2"/>
  </g>
  <text class="core" x="180" y="605" text-anchor="middle">AI Core 0</text>
  <text class="small" x="180" y="632" text-anchor="middle">assigned tasks</text>
  <text class="task" x="366" y="617" text-anchor="middle">T0</text>
  <text class="task" x="460" y="617" text-anchor="middle">T4</text>
  <text class="task" x="554" y="617" text-anchor="middle">T8</text>
  <path class="line" d="M295 610 H315" marker-end="url(#arrow)"/>
  <path class="line" d="M605 610 H650" marker-end="url(#arrow)"/>

  <!-- Timeline -->
  <text class="small" x="700" y="552">Time slot</text>
  <path class="line" d="M700 564 H1702" marker-end="url(#arrow)"/>
  <g class="small" text-anchor="middle">
    <text x="785" y="592">1</text><text x="955" y="592">2</text><text x="1125" y="592">3</text>
    <text x="1295" y="592">4</text><text x="1465" y="592">5</text><text x="1635" y="592">6</text>
  </g>

  <rect x="650" y="612" width="121" height="76" rx="9" fill="#EEF2F7" stroke="#718097" stroke-width="2"/>
  <rect x="650" y="714" width="121" height="76" rx="9" fill="#EEF2F7" stroke="#718097" stroke-width="2"/>
  <text class="core" x="710" y="643" text-anchor="middle">Buffer 0</text>
  <text class="small" x="710" y="670" text-anchor="middle">T0 → T8</text>
  <text class="core" x="710" y="745" text-anchor="middle">Buffer 1</text>
  <text class="small" x="710" y="772" text-anchor="middle">T4</text>

  <g stroke="#BCC6D4" stroke-width="1.5" stroke-dasharray="5 7">
    <path d="M785 600 V806"/><path d="M955 600 V806"/><path d="M1125 600 V806"/>
    <path d="M1295 600 V806"/><path d="M1465 600 V806"/><path d="M1635 600 V806"/><path d="M1805 600 V806"/>
  </g>

  <!-- Buffer 0: T0, then T8 -->
  <g filter="url(#shadow)">
    <rect x="785" y="612" width="168" height="76" rx="7" fill="#EAF2FF" stroke="#6D86AC" stroke-width="2"/>
    <rect x="955" y="612" width="168" height="76" rx="7" fill="#CFE0FA" stroke="#6D86AC" stroke-width="2"/>
    <rect x="1125" y="612" width="168" height="76" rx="7" fill="#EAF2FF" stroke="#6D86AC" stroke-width="2"/>
    <rect x="1295" y="612" width="168" height="76" rx="7" fill="#EAF2FF" stroke="#6D86AC" stroke-width="2"/>
    <rect x="1465" y="612" width="168" height="76" rx="7" fill="#CFE0FA" stroke="#6D86AC" stroke-width="2"/>
    <rect x="1635" y="612" width="168" height="76" rx="7" fill="#EAF2FF" stroke="#6D86AC" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text class="task" x="869" y="642">T0</text><text class="stage" x="869" y="670">load</text>
    <text class="task" x="1039" y="642">T0</text><text class="stage" x="1039" y="670">compute</text>
    <text class="task" x="1209" y="642">T0</text><text class="stage" x="1209" y="670">store</text>
    <text class="task" x="1379" y="642">T8</text><text class="stage" x="1379" y="670">load</text>
    <text class="task" x="1549" y="642">T8</text><text class="stage" x="1549" y="670">compute</text>
    <text class="task" x="1719" y="642">T8</text><text class="stage" x="1719" y="670">store</text>
  </g>

  <!-- Buffer 1: T4 begins while T0 is still in flight -->
  <g filter="url(#shadow)">
    <rect x="955" y="714" width="168" height="76" rx="7" fill="#E7F8F3" stroke="#62A18D" stroke-width="2"/>
    <rect x="1125" y="714" width="168" height="76" rx="7" fill="#C5EBDD" stroke="#62A18D" stroke-width="2"/>
    <rect x="1295" y="714" width="168" height="76" rx="7" fill="#E7F8F3" stroke="#62A18D" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text class="task" x="1039" y="744">T4</text><text class="stage" x="1039" y="772">load</text>
    <text class="task" x="1209" y="744">T4</text><text class="stage" x="1209" y="772">compute</text>
    <text class="task" x="1379" y="744">T4</text><text class="stage" x="1379" y="772">store</text>
  </g>

  <!-- Highlight simultaneous work -->
  <path d="M955 805 V823 H1463 V805" fill="none" stroke="#405B83" stroke-width="2"/>
  <text class="small" x="1209" y="850" text-anchor="middle">Operations in the same time slot overlap across the two buffers.</text>
  <text class="body" x="911.5" y="893" text-anchor="middle">Buffer 0 runs T0 then T8; Buffer 1 runs T4 in between, keeping load, compute, and store in flight.</text>
</svg>
